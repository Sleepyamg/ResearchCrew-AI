research_task:
  description: >
    Investigate {topic} using the Web Search tool.

    Generate relevant search queries.
    Collect information from at least three relevant sources.
    Compare the available search results.
    Do not invent URLs or unsupported claims.

    If the search tool fails, explicitly state that
    external research could not be completed.

  expected_output: >
    Structured research notes containing:
    - Research topic
    - Key findings
    - Source titles and URLs
    - Supporting search snippets
    - Research limitations

  agent: researcher
