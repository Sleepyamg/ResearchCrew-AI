research_task:
  description: >
    Research the topic: {topic}.
    The current year is {current_year}, so prioritise recent developments.

    1. Identify the 5 to 8 most important findings about the topic.
    2. For each finding, state the source it comes from (publication or website
       name, and URL if you know it).
    3. Rate your confidence in each finding as High, Medium or Low.
    4. List any open questions or claims that should be fact-checked later.
  expected_output: >
    A markdown research brief with these sections:
    "## Key Findings" (numbered findings, each with Source and Confidence),
    "## Open Questions" (bullet list of claims needing verification).
  agent: researcher
