[project]
name = "backend"
version = "0.1.0"
description = "backend using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai[tools]>=1.15.45,<2.0.0",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "trafilatura>=2.4.0",
]

[project.scripts]
backend = "backend.main:run"
run_crew = "backend.main:run"
train = "backend.main:train"
replay = "backend.main:replay"
test = "backend.main:test"
run_with_trigger = "backend.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "a080c314-9e6f-45cb-9fdb-97c4e58081fb"
