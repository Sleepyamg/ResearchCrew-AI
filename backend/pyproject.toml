[project]
name = "backend"
version = "0.1.0"
description = "ResearchCrew AI: hierarchical multi-agent research system built with CrewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai[tools]>=1.15.45,<2.0.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:run"
run_crew = "backend.main:run"
serve = "backend.api.app:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "a080c314-9e6f-45cb-9fdb-97c4e58081fb"
